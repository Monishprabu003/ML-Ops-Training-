# Dataset configuration for YOLO26-Pose fine-tuning
# Interview Behaviour Analysis - Pose Estimation
#
# Structure your dataset as:
#   dataset/
#   ├── train/
#   │   ├── images/
#   │   └── labels/
#   ├── val/
#   │   ├── images/
#   │   └── labels/
#   └── test/
#       ├── images/
#       └── labels/
#
# Label format (YOLO pose): class x_center y_center width height kp1_x kp1_y kp1_v ... kp17_x kp17_y kp17_v
# All values normalized to [0, 1]. Visibility: 0=not labeled, 1=labeled but occluded, 2=labeled and visible

# Dataset root path (update to your dataset location)
path: ./dataset
train: train/images
val: val/images
test: test/images

# Number of classes (person only for pose estimation)
nc: 1

# Class names
names:
  0: person

# Keypoints configuration
kpt_shape: [17, 3]  # 17 keypoints, 3 values each (x, y, visibility)

# COCO Keypoint order:
# 0: Nose
# 1: Left Eye
# 2: Right Eye
# 3: Left Ear
# 4: Right Ear
# 5: Left Shoulder
# 6: Right Shoulder
# 7: Left Elbow
# 8: Right Elbow
# 9: Left Wrist
# 10: Right Wrist
# 11: Left Hip
# 12: Right Hip
# 13: Left Knee
# 14: Right Knee
# 15: Left Ankle
# 16: Right Ankle

# Skeleton connections for visualization
skeleton:
  - [16, 14]
  - [14, 12]
  - [17, 15]
  - [15, 13]
  - [12, 13]
  - [6, 12]
  - [7, 13]
  - [6, 7]
  - [6, 8]
  - [7, 9]
  - [8, 10]
  - [9, 11]
  - [2, 3]
  - [1, 2]
  - [1, 3]
  - [2, 4]
  - [3, 5]
  - [4, 6]
  - [5, 7]

# Flip index mapping for horizontal flip (disabled for interview analysis)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]
